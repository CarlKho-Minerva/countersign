<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Application</title></head>
<body><h1>Application</h1>
<form method="post" action="/submit">
<label>Full name <input name="full_name" required></label>
<label><input type="checkbox" name="tos"> I have read and agree to the Terms of Service and Privacy Policy</label>
<label><input type="checkbox" name="partner_offers" required checked> Yes, share my details with our partners for special offers</label>
<label><input type="checkbox" name="work_auth" required> I certify that I am legally authorized to work in the United States</label>
<label><input type="checkbox" name="remember" checked> Remember my details on this device</label>
<button type="submit" name="apply">Apply</button>
</form></body></html>
