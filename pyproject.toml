[project]
name = "countersign"
version = "0.1.0"
description = "Forms your agents can fill, in a sandbox, with a receipt you sign."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "cryptography>=45",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
markers = ["docker: needs a running Docker engine (real sandbox)"]
